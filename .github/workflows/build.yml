name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test -c Release

      - name: Publish
        run: dotnet publish src/ScopeTrace -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: ScopeTrace
          path: publish/ScopeTrace.exe

      # Code signing (SignPath) will go here once the project is accepted.

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" publish/ScopeTrace.exe --title "ScopeTrace ${{ github.ref_name }}" --notes-file RELEASE_NOTES.md
